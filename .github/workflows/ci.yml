name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.14.14
      - name: Ruff lint
        run: ruff check .
      - name: Install mypy
        # Pinned for the same reason as ruff above: an unpinned mypy silently
        # picks up new checks and turns a green main red without a code change.
        run: pip install mypy==2.3.1
      - name: Type-check with mypy
        # The lenient [tool.mypy] config ignores missing third-party stubs, so
        # the heavy runtime deps (aiogram/langchain/fastapi/sqlalchemy) need not
        # be installed for the static gate to pass.
        run: mypy .
      - name: Byte-compile sources
        run: python -m compileall -q .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal test deps
        # Intentionally NOT `-r requirements.txt`: skip langchain/chromadb/aiogram.
        # fastapi + httpx are needed for tests/test_app.py (TestClient).
        run: pip install pytest sqlalchemy "fastapi==0.104.1" "httpx==0.27.2"
      - name: Run tests
        run: pytest -q
