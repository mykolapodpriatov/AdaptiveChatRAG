name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.14.14
      - name: Ruff lint
        run: ruff check .
      - name: Byte-compile sources
        run: python -m compileall -q .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal test deps
        # Intentionally NOT `-r requirements.txt`: the test suite only touches
        # database.py/feedback.py, which need nothing beyond SQLAlchemy. Pulling
        # langchain/chromadb/aiogram would bloat the job for no benefit.
        run: pip install pytest sqlalchemy
      - name: Run tests
        run: pytest -q
